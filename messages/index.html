<!doctype html>
<html lang="en">
<head>
<script>/*lux-theme-early*/(function(){try{if(localStorage.getItem("lux_theme")==="light"){document.documentElement.setAttribute("data-theme","light");}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Messages &mdash; Luxucleen</title>
<meta name="description" content="Your Luxucleen inbox. Luxu, your setup assistant, is here to help you get your product set up and answer any question.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://luxucleen.com/messages/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://luxucleen.com/messages/">
<meta property="og:title" content="Your Messages &mdash; Luxucleen">
<meta property="og:description" content="Luxu, your setup assistant, is here to help you get set up.">
<meta property="og:image" content="https://luxucleen.com/og/messages.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="https://luxucleen.com/og/messages.png">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:site_name" content="Luxucleen LLC">
<link rel="stylesheet" href="/site.css">
<style>
  :root{--lxw:640px;--vio:#7c5cff;--grn:#2ea27e}
  html,body{height:100%}
  body{display:flex;flex-direction:column;min-height:100dvh;margin:0}
  .lab-grad{background:linear-gradient(90deg,var(--vio),var(--grn));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .lxtop{position:sticky;top:0;z-index:35;display:flex;align-items:center;gap:11px;padding:11px 15px;background:color-mix(in srgb,var(--soft) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .lxtop .lav{width:40px;height:40px;border-radius:50%;background:linear-gradient(150deg,var(--vio),var(--grn));display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;box-shadow:0 4px 14px rgba(124,92,255,.4)}
  .lxtop .who b{display:block;font-size:16px;font-weight:800;line-height:1.15}
  .lxtop .who span{display:block;font-size:12px;color:var(--grn);font-weight:700}
  .lxtop .who span .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grn);margin-right:5px;vertical-align:middle}
  .lxtop .bk{margin-left:auto;color:var(--dim);text-decoration:none;font-size:13px}
  main{flex:1;width:100%;max-width:var(--lxw);margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column}
  .prodbar{display:flex;align-items:center;gap:10px;padding:10px 15px;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}
  .prodbar b{color:var(--ink);font-weight:800}
  .prodbar .pill{margin-left:auto;font:800 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--grn);border:1px solid rgba(46,162,126,.4);border-radius:999px;padding:5px 8px}
  .thread{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:9px;max-width:86%}
  .row.me{align-self:flex-end;flex-direction:row-reverse}
  .row .bav{width:30px;height:30px;border-radius:50%;flex:0 0 auto;background:linear-gradient(150deg,var(--vio),var(--grn));display:flex;align-items:center;justify-content:center;font-size:15px}
  .bub{padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .row.luxu .bub{background:var(--soft);border:1px solid var(--line);border-top-left-radius:5px}
  .row.me .bub{background:linear-gradient(135deg,var(--vio),var(--grn));color:#fff;border-top-right-radius:5px}
  .row.me .bav{background:rgba(127,127,127,.15);color:var(--dim);font-weight:800;font-size:13px}
  .typing{align-self:flex-start;color:var(--dim);font-size:13px;padding:2px 6px;display:none}
  .typing.on{display:block}
  .compose{position:sticky;bottom:0;display:flex;gap:9px;padding:11px 12px calc(11px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--soft) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .compose input{flex:1;background:rgba(127,127,127,.08);border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:inherit;font:inherit;font-size:15px}
  .compose button{width:46px;height:46px;flex:0 0 auto;border:0;border-radius:50%;background:linear-gradient(135deg,var(--vio),var(--grn));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .compose button svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .compose button:disabled{opacity:.5}
  .gate{margin:auto;max-width:400px;text-align:center;padding:34px 22px}
  .gate .em{font-size:44px}
  .gate h1{font-size:22px;margin:12px 0 6px}
  .gate p{color:var(--dim);font-size:14.5px;line-height:1.5;margin:0 0 16px}
  .gate input{width:100%;box-sizing:border-box;background:rgba(127,127,127,.08);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:inherit;font:inherit;font-size:15px;margin-bottom:10px;text-align:center}
  .gate button{width:100%;background:linear-gradient(135deg,var(--vio),var(--grn));color:#fff;border:0;border-radius:12px;padding:14px;font-weight:800;cursor:pointer;font:inherit;font-size:15px}
  .foot{text-align:center;color:var(--dim);font-size:11.5px;padding:8px 12px 12px}
</style>
</head>
<body>
<div class="lxtop">
  <span class="lav">&#128274;</span>
  <span class="who"><b>Luxu <span class="lab-grad">Support</span></b><span><span class="dot"></span>Here to help you get set up</span></span>
  <a class="bk" href="/">&times; Close</a>
</div>

<main id="app">
  <div class="prodbar" id="prodbar" hidden><span>Your purchase:</span> <b id="prodname">&mdash;</b><span class="pill">Order</span></div>
  <div class="thread" id="thread"></div>
  <div class="typing" id="typing">Luxu is typing&hellip;</div>
  <div class="compose" id="compose" hidden>
    <input id="msg" type="text" maxlength="800" placeholder="Type your message to Luxu&hellip;" autocomplete="off">
    <button type="button" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></button>
  </div>
  <div class="gate" id="gate" hidden>
    <div class="em">&#128233;</div>
    <h1>Open your inbox</h1>
    <p>Paste the order code from your purchase confirmation to reach Luxu, your setup assistant.</p>
    <input id="oidin" type="text" maxlength="48" placeholder="Order code" autocomplete="off">
    <button type="button" id="oidgo">Open my messages</button>
  </div>
</main>
<div class="foot">Luxucleen LLC &middot; Your setup assistant. Real help, on your product.</div>

<script>/*luxu-messages*/(function(){try{
  var API="https://ai.luxucleen.com/ask";
  var thread=document.getElementById("thread"),compose=document.getElementById("compose"),gate=document.getElementById("gate");
  var prodbar=document.getElementById("prodbar"),typing=document.getElementById("typing");
  function esc(s){var d=document.createElement("div");d.textContent=(s==null?"":String(s));return d.innerHTML;}
  function post(body){return fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json();});}
  function qp(k){try{return new URLSearchParams(location.search).get(k);}catch(e){return null;}}

  var oid=qp("o")||qp("order")||"";
  if(oid){try{localStorage.setItem("luxu_order",oid.replace(/[^a-z0-9_-]/gi,""));}catch(e){}}
  if(!oid){try{oid=localStorage.getItem("luxu_order")||"";}catch(e){}}
  oid=(oid||"").replace(/[^a-z0-9_-]/gi,"").slice(0,48);

  function bubble(m){
    var luxu=(m.from!=="buyer");
    return '<div class="row '+(luxu?"luxu":"me")+'"><span class="bav">'+(luxu?"&#128737;&#65039;":"&#128100;")+'</span><span class="bub">'+esc(m.text)+'</span></div>';
  }
  function render(msgs){thread.innerHTML=(msgs||[]).map(bubble).join("");thread.scrollTop=thread.scrollHeight;}
  function showGate(){gate.hidden=false;compose.hidden=true;prodbar.hidden=true;
    document.getElementById("oidgo").addEventListener("click",function(){
      var v=(document.getElementById("oidin").value||"").replace(/[^a-z0-9_-]/gi,"").slice(0,48);
      if(v){try{localStorage.setItem("luxu_order",v);}catch(e){}location.search="?o="+v;}
    });}

  function load(){
    if(!oid){showGate();return;}
    post({mode:"feed",op:"inbox_get",orderid:oid}).then(function(d){
      if(!d||!d.ok||!d.order){showGate();return;}
      gate.hidden=true;compose.hidden=false;
      if(d.order.product){document.getElementById("prodname").textContent=d.order.product;prodbar.hidden=false;}
      render(d.messages&&d.messages.length?d.messages:[{from:"luxu",text:"Hi! I'm Luxu, your setup assistant. How can I help you get set up today?"}]);
    }).catch(function(){showGate();});
  }

  function send(){
    var el=document.getElementById("msg"),btn=document.getElementById("send");
    var t=(el.value||"").trim();if(!t||!oid)return;
    thread.insertAdjacentHTML("beforeend",bubble({from:"buyer",text:t}));thread.scrollTop=thread.scrollHeight;
    el.value="";btn.disabled=true;typing.classList.add("on");
    post({mode:"feed",op:"inbox_send",orderid:oid,text:t}).then(function(d){
      typing.classList.remove("on");btn.disabled=false;
      if(d&&d.reply){thread.insertAdjacentHTML("beforeend",bubble(d.reply));thread.scrollTop=thread.scrollHeight;}
      el.focus();
    }).catch(function(){typing.classList.remove("on");btn.disabled=false;
      thread.insertAdjacentHTML("beforeend",bubble({from:"luxu",text:"I couldn't send that just now — please try again in a moment."}));});
  }
  document.getElementById("send").addEventListener("click",send);
  document.getElementById("msg").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send();}});

  load();
}catch(e){}})();</script>
<script>/*lux-theme*/(function(){try{
function cur(){return document.documentElement.getAttribute("data-theme")==="light"?"light":"dark";}
var b=document.createElement("button");b.type="button";b.setAttribute("aria-label","Switch light or dark theme");
b.style.cssText="position:fixed;right:14px;top:66px;z-index:2147483001;width:38px;height:38px;border-radius:50%;border:1px solid rgba(128,128,128,.35);cursor:pointer;font-size:17px;line-height:1;background:rgba(20,22,28,.55);color:#e7ebf1;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)";
function icon(){b.textContent=cur()==="light"?"☾":"☀";}
icon();
b.addEventListener("click",function(){var next=cur()==="light"?"dark":"light";if(next==="light"){document.documentElement.setAttribute("data-theme","light");}else{document.documentElement.removeAttribute("data-theme");}try{localStorage.setItem("lux_theme",next);}catch(e){}icon();});
document.body.appendChild(b);
}catch(e){}})();</script>
</body>
</html>
